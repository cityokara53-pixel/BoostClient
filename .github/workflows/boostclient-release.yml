name: Build and publish BoostClient

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  windows-release:
    name: Windows app package
    runs-on: windows-2022
    permissions:
      contents: read

    env:
      BUILD_PLATFORM: Windows-MSVC
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Set up build dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.9.3

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
            throw "Expected a release tag like 1.2.3"
          }
          "version=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          "major=$($Matches.major)" >> $env:GITHUB_OUTPUT
          "minor=$($Matches.minor)" >> $env:GITHUB_OUTPUT
          "patch=$($Matches.patch)" >> $env:GITHUB_OUTPUT

      - name: Configure BoostClient
        shell: pwsh
        env:
          BOOSTCLIENT_VERSION_MAJOR: ${{ steps.version.outputs.major }}
          BOOSTCLIENT_VERSION_MINOR: ${{ steps.version.outputs.minor }}
          BOOSTCLIENT_VERSION_PATCH: ${{ steps.version.outputs.patch }}
        run: |
          cmake --preset $env:CMAKE_PRESET `
            "-DLauncher_UPDATER_GITHUB_REPO=https://github.com/cityokara53-pixel/OGClient-Releases" `
            "-DVCPKG_HOST_TRIPLET=$env:VCPKG_TRIPLET" `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET"

      - name: Build
        shell: pwsh
        run: cmake --build --preset $env:CMAKE_PRESET --config $env:BUILD_TYPE

      - name: Test
        shell: pwsh
        run: ctest --test-dir build --build-config Release --output-on-failure --exclude-regex "^FileSystem$"

      - name: Package app ZIP
        shell: pwsh
        env:
          BUILD_DIR: build
          INSTALL_DIR: install
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = "release\BoostClient-Windows-MSVC-App-$env:VERSION.zip"
          New-Item release -ItemType Directory -Force | Out-Null
          cmake --install $env:BUILD_DIR --config Release --prefix $env:INSTALL_DIR
          if (-not (Test-Path "$env:INSTALL_DIR\boostclient.exe")) {
            throw "boostclient.exe missing from app package"
          }
          Compress-Archive -Path "$env:INSTALL_DIR\*" -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Require public release repository token
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if (-not $env:RELEASES_TOKEN) {
            throw "Add the fine-grained RELEASES_TOKEN secret with Contents: Read and write access to OGClient-Releases."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          repository: cityokara53-pixel/OGClient-Releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: OG Client ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/BoostClient-Windows-MSVC-App-${{ steps.version.outputs.version }}.zip
            release/SHA256SUMS.txt
